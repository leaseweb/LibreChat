# Leaseweb build. Publishes ghcr.io/leaseweb/librechat from our tags.
# Upstream's own image workflows are disabled on this fork; see AI-414.
name: LSW Build and Push Image

on:
  push:
    tags:
      - 'v*-lsw.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v0.8.6-lsw.1)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve image tag and build metadata
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGE_TAG="${{ inputs.tag }}"
          else
            IMAGE_TAG="${GITHUB_REF_NAME}"
          fi
          printf 'IMAGE_TAG=%s\n'    "$IMAGE_TAG" >> "$GITHUB_ENV"
          printf 'BUILD_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'BUILD_BRANCH=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          printf 'BUILD_DATE=%s\n'   "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image build reads .env at build time; upstream does the same.
      - name: Prepare environment
        run: cp .env.example .env

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: node
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/librechat:${{ env.IMAGE_TAG }}
          build-args: |
            BUILD_COMMIT=${{ env.BUILD_COMMIT }}
            BUILD_BRANCH=${{ env.BUILD_BRANCH }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
